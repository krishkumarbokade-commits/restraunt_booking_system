<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Spice Garden – Authentic Indian Cuisine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css"/>
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Ambient background layers -->
  <div class="bg-layer bg-layer-1"></div>
  <div class="bg-layer bg-layer-2"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="grain"></div>

  {% block content %}{% endblock %}

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- ═══════════ AI CHATBOT WIDGET (appears on every page) ═══════════ -->
  <button class="chat-fab" id="chatFab" onclick="toggleChat()" aria-label="Chat with Spice Garden">
    <span class="chat-fab-icon-open">💬</span>
    <span class="chat-fab-icon-close">✕</span>
  </button>

  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-avatar">🪔</span>
        <div>
          <div class="chat-title">Spice Bot</div>
          <div class="chat-subtitle"><span class="chat-status-dot"></span> Ask me about the menu or booking</div>
        </div>
      </div>
      <button class="chat-minimize" onclick="toggleChat()" aria-label="Close chat">✕</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg chat-msg-bot">
        <span class="chat-msg-avatar">🪔</span>
        <div class="chat-bubble">
          Namaste! I'm Spice Bot 🙏 Ask me about our menu, dish recommendations, or how to book a table.
        </div>
      </div>
    </div>

    <div class="chat-typing" id="chatTyping" style="display:none">
      <span class="chat-msg-avatar">🪔</span>
      <div class="chat-bubble chat-bubble-typing">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>
    </div>

    <form class="chat-input-row" id="chatForm" onsubmit="sendChatMessage(event)">
      <input type="text" id="chatInput" placeholder="Type a message…" autocomplete="off" maxlength="500"/>
      <button type="submit" class="chat-send-btn" aria-label="Send">➤</button>
    </form>
  </div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
